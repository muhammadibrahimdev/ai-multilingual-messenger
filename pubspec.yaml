name: ai_multilingual_messenger
description: Android messenger with automatic English-Urdu translation for text and voice messages.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
